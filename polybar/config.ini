[colors]
background = #282828
foreground = #ebdbb2
accent = #d79921
muted = #928374
[module/music]
type = custom/text
label =  󰎈
content-font =1
label-foreground = ${colors.foreground}
label-padding = 1

click-left = ~/.config/rofi/music.sh
[module/rofi]
type = custom/text

content = 󰍉
content-foreground = ${colors.foreground}
content-padding = 1

click-left = rofi -show drun
[module/powermenu]
type = custom/text
content = "⌘"
content-font = 
click-left = ~/.config/i3/scripts/powermenu
[bar/example]

width = 100%
height = 28pt
radius = 0
corner-radius = 0;
; dpi = 96

background = #00282828
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator =  
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:style=bold:size= 13;2
font-1 = JetBrainsMono Nerd Font:style=bold:size=15;2
modules-left =  xworkspaces 
modules-right = network pulseaudio rofi powermenu
modules-center = date
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = ●
label-active-padding = 1

label-occupied = ○
label-occupied-padding = 1

label-empty = ○
label-empty-padding = 1
pin-workspaces = true

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = "  󰕾 "

label-muted = 󰝟
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = 󰌌 %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 2

format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/wifi-menu.sh
[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %d %b
time = %H:%M

label = %time%
label-padding = 1
[module/battery]
type = internal/battery

battery = BAT0
adapter = ADP0

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
